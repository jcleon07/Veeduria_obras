# Nginx: serves the React build and forwards the backend routes to Django (Gunicorn)

upstream django {
    # "backend" is the name of the Django service in docker-compose.yml
    server backend:8000;
}

server {
    listen 80;
    server_name _;

    # Maximum size of uploaded files (profile photos and construction site images)
    client_max_body_size 10M;

    # Frontend: static build of React (copied here by the Nginx Dockerfile)
    root /usr/share/nginx/html;
    index index.html;

    # Headers that Django needs when it is behind a proxy
    proxy_set_header Host              $host;                       # original host -> ALLOWED_HOSTS
    proxy_set_header X-Real-IP         $remote_addr;                # real IP of the user
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;                     # http or https -> SECURE_PROXY_SSL_HEADER

    # Backend routes: REST API, Django admin and static files (served by WhiteNoise)
    location /api/    { proxy_pass http://django; }
    location /admin/  { proxy_pass http://django; }
    location /static/ { proxy_pass http://django; }

    # Uploaded files: read directly from the shared media volume
    location /media/ {
        alias /usr/share/nginx/media/;
    }

    # Single-page application: unknown routes go to index.html (React Router)
    location / {
        try_files $uri $uri/ /index.html;
    }
}
